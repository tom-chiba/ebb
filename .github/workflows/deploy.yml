name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Verify Cloudflare authentication
        run: pnpm --filter @ebb/web exec wrangler d1 info ebb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify required Worker secrets are set
        # BETTER_AUTH_SECRET が無いと全ページが 500 になる（apps/web/src/hooks.server.ts）。
        # ここで値そのものを出力せず名前の有無だけを確認し、無ければデプロイ前に落とす。
        run: |
          names=$(pnpm --filter @ebb/web exec wrangler secret list --format=json | jq -r '.[].name')
          missing=""
          for required in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if ! grep -qx "$required" <<< "$names"; then
              missing="$missing $required"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — run 'wrangler secret put <NAME>' before deploying"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify required scheduler secrets are set
        # Worker secrets は Worker ごとに独立している。web 側に同名の secret があっても
        # scheduler からは参照できないため、scheduler 自身の設定を確認する。
        run: |
          names=$(pnpm --filter @ebb/scheduler exec wrangler secret list --format=json | jq -r '.[].name')
          if ! grep -qx VAPID_PRIVATE_KEY <<< "$names"; then
            echo "::error::Missing required scheduler secret: VAPID_PRIVATE_KEY — run 'pnpm --filter @ebb/scheduler exec wrangler secret put VAPID_PRIVATE_KEY'"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: pnpm build

      - name: Migrate production D1
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
