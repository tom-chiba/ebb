packages:
  - 'apps/*'
  - 'packages/*'

# 全パッケージで共有するバージョン。各 package.json では "catalog:" と書く
catalog:
  typescript: ~6.0.3

# 公開直後の版は解決しない（既定は 1440 = 1 日）。乗っ取り公開が取り下げられるまでの
# 猶予を稼ぐ。どうしても出たての版が要るときは minimumReleaseAgeExclude に足す
minimumReleaseAge: 10080

# 過去のリリースより信頼レベルが下がった版が来たら install を失敗させる（既定は off）
trustPolicy: no-downgrade

# chokidar@4.0.2/4.0.3 は provenance attestation なしで公開された（乗っ取りではなく
# CI 変更由来と判明済み。5.0.0 で provenance は復活している）ため個別に許可する
#
# semver@6.3.1（npm 公式 npm-cli-ops による legacy dist-tag "latest-6"、公開は
# 2023-07-10）は provenance を持たないが、pnpm の no-downgrade は無関係な semver@7.x
# 系（provenance あり）の公開日時と比較して誤検知する（乗っ取りではなくメジャー系列を
# 跨いだ比較起因と判明済み。pnpm/pnpm discussion #11084 で同事象が報告されている）
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

# strictDepBuilds（既定 true）によりビルドスクリプトが既定でブロックされる依存を許可する
allowBuilds:
  # @better-auth/cli 経由で入るが、Prisma / better-sqlite3 アダプターは使わない
  # （drizzleAdapter + D1 のみ）ため、ネイティブビルドは実行不要
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260730.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260730.1'
  - '@cloudflare/workerd-linux-64@1.20260730.1'
  - '@cloudflare/workerd-linux-arm64@1.20260730.1'
  - '@cloudflare/workerd-windows-64@1.20260730.1'
  - miniflare@5.20260730.0-alpha
  - workerd@1.20260730.1
  - wrangler@4.118.0
